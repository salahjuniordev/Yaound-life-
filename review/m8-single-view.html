<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M8 production-geometry single view</title>
<style>
  html, body { margin: 0; background: #0d151c; color: #eaf1f5; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; }
  #label {
    position: fixed; left: 14px; top: 14px; padding: 8px 12px; border-radius: 6px;
    background: rgba(10, 18, 24, 0.82); color: #fff; font-size: 16px; line-height: 1.35;
    pointer-events: none; max-width: 640px;
  }
  #label small { display: block; color: #b9d0dc; font-size: 11px; font-weight: 400; margin-top: 3px; }
  #status { position: fixed; left: 14px; bottom: 14px; color: #9fb4c2; font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; max-width: 900px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="label">Loading…</div>
<div id="status">Loading production world…</div>
<script type="module" src="./m8-single-view.ts"></script>
</body>
</html>
