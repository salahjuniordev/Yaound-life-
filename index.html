<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1208" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Yaounde Life - a 3D life simulator set in Yaounde, Cameroon. Wake up, hustle, build your life in the city." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Yaounde Life</title>
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1208; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #2b1c0d 0%, #1a1208 70%); color: #f5e6c8; font-family: system-ui, sans-serif; }
      #boot .logo { font-size: 28px; font-weight: 800; letter-spacing: 1px; color: #ffb733; }
      #boot .sub { font-size: 13px; margin-top: 8px; opacity: 0.8; }
      #boot .bar { width: 180px; height: 6px; border-radius: 3px; background: #3a2a14; margin-top: 22px; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 30%; border-radius: 3px; background: #ffb733; animation: load 1.2s ease-in-out infinite; }
      @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="logo">YAOUNDE LIFE</div>
      <div class="sub">Loading the city&hellip;</div>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
