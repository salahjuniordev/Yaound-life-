<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Yaoundé Life" />
    <meta name="application-name" content="Yaoundé Life" />
    <meta
      name="description"
      content="A Sims-style life game set in Yaoundé. Ride taxis in Mvog-Mbi, eat at Mokolo, survive delestage, vote for your mayor — and live your Yaoundé story. Free in your browser."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./new-app-icon.png" sizes="1024x1024" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Yaoundé Life — live your Yaoundé story</title>
    <script>
      try {
        var t = localStorage.getItem('yaounde-theme');
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    <style>
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('/fonts/fredoka-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #eef2f7;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(700px 360px at 80% 0%, rgba(255, 255, 255, 0.85) 0%, transparent 70%),
          linear-gradient(180deg, #bfe0f7 0%, #e8f1f7 50%, #eef2f7 100%);
        color: #1d2433;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      #boot .mark {
        width: 112px;
        height: 112px;
        border-radius: 28px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: #000;
        box-shadow: 0 10px 30px rgba(16, 24, 40, 0.12);
      }
      #boot .mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      #boot .logo {
        font-family: 'Fredoka', system-ui, sans-serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-top: 16px;
      }
      #boot .sub {
        font-size: 13px;
        margin-top: 5px;
        color: #5b6478;
      }
      #boot .dots {
        display: flex;
        gap: 6px;
        margin-top: 22px;
      }
      #boot .dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(29, 36, 51, 0.24);
        animation: boot-bounce 1s infinite ease-in-out;
      }
      #boot .dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot .dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes boot-bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        40% {
          transform: translateY(-6px);
          opacity: 1;
        }
      }
      @media (prefers-color-scheme: dark) {
        html[data-theme='dark'] body,
        html[data-theme='dark'] #root {
          background: #10141c;
        }
        html[data-theme='dark'] #boot {
          background:
            radial-gradient(700px 360px at 80% 0%, rgba(76, 195, 138, 0.14) 0%, transparent 70%),
            linear-gradient(180deg, #0e1a26 0%, #101722 50%, #10141c 100%);
          color: #f4efe7;
        }
        html[data-theme='dark'] #boot .mark {
          background: #000;
          color: #4cc38a;
        }
        html[data-theme='dark'] #boot .sub {
          color: #c3bdba;
        }
        html[data-theme='dark'] #boot .dots i {
          background: rgba(255, 255, 255, 0.28);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="mark">
        <img src="./new-app-icon.png" alt="" width="112" height="112" />
      </div>
      <div class="logo">Yaoundé Life</div>
      <div class="sub">Waking up the city…</div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
